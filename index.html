<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CABINET MONITOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
  /* 1 หน่วย = 1 พิกเซลของรูปต้นแบบขนาด 1920 x 1080 (สเกลตามหน้าจอ) */
  :root{
    --px: calc(max(100vw, 100vh * 16 / 9) / 1920);
    --bg: #fef6f3;
    --track: #6d6969;
    --track-on: #6b9fe0;
    --knob-border: #143f87;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg); }

  /* เวทีอัตราส่วน 16:9 ขยายเต็มจอแบบ cover (สำหรับ desktop) */
  .stage{
    position:absolute; left:50%; top:50%;
    width:calc(var(--px) * 1920);
    height:calc(var(--px) * 1080);
    transform:translate(-50%,-50%);
    background:url("2.png") center/100% 100% no-repeat;
    user-select:none; -webkit-user-select:none;
  }
  h1{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* ตัวเลขในการ์ด: --cx = กึ่งกลางแนวนอน, --top = ตำแหน่งบน (หน่วยพิกเซลต้นแบบ) */
  .value{
    position:absolute;
    left:calc(var(--px) * var(--cx)); top:calc(var(--px) * var(--top));
    transform:translateX(-50%);
    font-family:"Inter","Arial",sans-serif;
    font-weight:600; font-size:calc(var(--px) * 84); line-height:1; letter-spacing:calc(var(--px) * 11); padding-left:calc(var(--px) * 11);
    color:#000; white-space:nowrap; pointer-events:none;
  }
  #v-temp { --cx:544;  --top:360; }
  #v-hum  { --cx:903;  --top:359.5; }
  #v-smoke{ --cx:1285.5; --top:355; }

  /* ปุ่ม toggle */
  .toggle{
    position:absolute; top:calc(var(--px) * 622);
    width:calc(var(--px) * 201); height:calc(var(--px) * 80);
    border-radius:calc(var(--px) * 40);
    background:var(--track);
    cursor:pointer; touch-action:none; outline:none;
    transition:background .25s ease;
    --p:0;
  }
  .toggle[aria-checked="true"]{ background:var(--track-on); }
  .toggle:focus-visible{ box-shadow:0 0 0 calc(var(--px) * 5) rgba(43,111,200,.55); }
  .knob{
    position:absolute; left:0; top:calc(var(--px) * 7);
    width:calc(var(--px) * 67); height:calc(var(--px) * 67);
    border-radius:50%;
    border:calc(var(--px) * 4) solid var(--knob-border);
    background:linear-gradient(90deg,#2a7ab1,#1c308c);
    transform:translateX(calc(var(--px) * 134 * var(--p)));
    transition:transform .22s cubic-bezier(.4,0,.2,1);
  }
  .toggle.dragging .knob{ transition:none; }
  #t-temp { left:calc(var(--px) * 441); }
  #t-hum  { left:calc(var(--px) * 799); }
  #t-smoke{ left:calc(var(--px) * 1178); }
</style>
</head>
<body>
  <main class="stage">
    <h1>CABINET MONITOR</h1>

    <div class="value" id="v-temp">30</div>
    <div class="value" id="v-hum">50</div>
    <div class="value" id="v-smoke">1023</div>

    <div class="toggle" id="t-temp"  role="switch" aria-checked="false" aria-label="อุณหภูมิ"  tabindex="0" data-target="v-temp"  data-min="20" data-max="40"><div class="knob"></div></div>
    <div class="toggle" id="t-hum"   role="switch" aria-checked="false" aria-label="ความชื้น"  tabindex="0" data-target="v-hum"   data-min="30" data-max="90"><div class="knob"></div></div>
    <div class="toggle" id="t-smoke" role="switch" aria-checked="false" aria-label="ควัน"     tabindex="0" data-target="v-smoke" data-min="0"  data-max="1023"><div class="knob"></div></div>
  </main>

<script>
  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const UPDATE_MS = 1500;   // ความถี่การสุ่มค่าเมื่อ toggle เป็น ON

  document.querySelectorAll('.toggle').forEach(tg => {
    const out = document.getElementById(tg.dataset.target);
    const min = +tg.dataset.min, max = +tg.dataset.max;
    let on = false, timer = null;

    const randomize = () => { out.textContent = rand(min, max); };

    const setState = (state) => {
      on = state;
      tg.setAttribute('aria-checked', on);
      tg.style.setProperty('--p', on ? 1 : 0);
      clearInterval(timer);
      if (on) { randomize(); timer = setInterval(randomize, UPDATE_MS); } // ON  = สุ่มค่าต่อเนื่อง
    };                                                                     // OFF = หยุดค่าไว้

    randomize();       // สุ่มค่าตอนเปิดหน้าเว็บ (เค้าโครงอยู่ที่เดิม)
    setState(false);

    // คลิก / ลากปุ่ม
    let startX = 0, moved = false, dragging = false;
    const posToP = (x) => {
      const r = tg.getBoundingClientRect(), k = r.height;
      return Math.min(1, Math.max(0, (x - r.left - k / 2) / (r.width - k)));
    };
    tg.addEventListener('pointerdown', e => {
      dragging = true; moved = false; startX = e.clientX;
      tg.setPointerCapture(e.pointerId);
    });
    tg.addEventListener('pointermove', e => {
      if (!dragging) return;
      if (Math.abs(e.clientX - startX) > 4) {
        moved = true; tg.classList.add('dragging');
        tg.style.setProperty('--p', posToP(e.clientX));
      }
    });
    tg.addEventListener('pointerup', e => {
      if (!dragging) return;
      dragging = false; tg.classList.remove('dragging');
      setState(moved ? posToP(e.clientX) >= 0.5 : !on);
    });
    tg.addEventListener('pointercancel', () => { dragging = false; tg.classList.remove('dragging'); setState(on); });

    tg.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setState(!on); }
      if (e.key === 'ArrowRight') setState(true);
      if (e.key === 'ArrowLeft')  setState(false);
    });
  });
</script>
</body>
</html>
